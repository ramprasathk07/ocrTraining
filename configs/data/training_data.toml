# Data engine config: python -m dataEngine --config configs/data/training_data.toml <step>
# Paths are relative to the repo root.

seed = 1234

[golden]
data_root = "dataEngine/data/train"
out_dir = "outputs/data/golden"
exclude_langs = ["mr"]   # V1 is Hindi + English; Marathi pages are set aside for V2
drop_invalid = false     # true = skip invalid pages; every one is listed in problems.json

[split]
out_dir = "outputs/data/splits"
test_fraction = 0.15
dev_fraction = 0.15
max_group_fraction = 0.15   # a police station larger than this is split by document

[[sources]]
name = "golden_regions"
converter = "golden_regions"
pages = "outputs/data/golden/pages.jsonl"
splits = "outputs/data/splits"
data_root = "dataEngine/data/train"
out_dir = "outputs/data/crops/golden_regions"

# Official public sets (docs/training-plan.md §8). Names must match the Stage 1 configs.
# Unzip train.zip, val.zip and test.zip of one set inside its root: each makes <split>/ with
# images/ and <split>_gt.txt, lines "images/<file><TAB><text>" (zips checked 2026-11-26).

[[sources]]   # printed Hindi words, 79,762 / 10,114 / 10,173, CC BY 4.0, https://ilocr.iiit.ac.in/dataset/7/
name = "mozhi_hi"
converter = "labelled_folder"
root = "downloads/mozhi_hi"
label_files = { train = "train/train_gt.txt", dev = "val/val_gt.txt", test = "test/test_gt.txt" }
separator = "\t"
langs = ["hi"]
script = "printed"
level = "word"
out_dir = "outputs/data/crops/mozhi_hi"

[[sources]]   # handwritten Hindi words (IIIT-INDIC-HW-WORDS-Hindi), 69,853 / 12,708 / 12,869, CC BY 4.0, https://ilocr.iiit.ac.in/dataset/18/
name = "iiit_hw_dev"
converter = "labelled_folder"
root = "downloads/iiit_hw_dev"
label_files = { train = "train/train_gt.txt", dev = "val/val_gt.txt", test = "test/test_gt.txt" }
separator = "\t"
langs = ["hi"]
script = "handwritten"
level = "word"
out_dir = "outputs/data/crops/iiit_hw_dev"

# Not configured yet:
#   dohascript: the authors' HF repo has 200 page images and no transcriptions; full set on request.
#   iam_lines:  lines.txt is not "<image><sep><text>", so it needs its own converter.
