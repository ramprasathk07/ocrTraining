# Test data (dataEngine/data/test_data) → records for evaluation only.
#   python -m dataEngine --config configs/data/test_data.toml golden
#   python -m dataEngine --config configs/data/test_data.toml split
#   python -m dataEngine --config configs/data/test_data.toml --workers 8 crops --source golden_regions
#   python -m dataEngine --config configs/data/test_data.toml --workers 8 crops --source printed_words

seed = 1234

[golden]
data_root = "dataEngine/data/test_data/src_golden"
out_dir = "outputs/data/test/golden"
exclude_langs = ["mr"]
drop_invalid = false

[golden.station_overrides]
# Document ids the <District>_<Station>_PS_<case>_<yy> pattern cannot split correctly.
# These are readings of the file names, not confirmed: correct them if wrong.
"Darbhanga_BadhGao_13_26" = ["Darbhanga", "BadhGao"]
"West_Champaran_Sri_Nagar_PS_90_18" = ["West_Champaran", "Sri_Nagar"]
"Rail_Patna_Rail_Patna_cyber_PS_09_23" = ["Rail_Patna", "Rail_Patna_cyber"]

[split]   # everything in test_data is test data
out_dir = "outputs/data/test/splits"
test_fraction = 1.0
dev_fraction = 0.0
max_group_fraction = 1.0

[[sources]]   # 538 regions from 49 golden pages
name = "golden_regions"
converter = "golden_regions"
pages = "outputs/data/test/golden/pages.jsonl"
splits = "outputs/data/test/splits"
data_root = "dataEngine/data/test_data/src_golden"
out_dir = "outputs/data/test/crops/golden_regions"

[[sources]]   # 10,173 printed Hindi words (Mozhi test set; test_data/cvit is an identical copy)
name = "printed_words"
converter = "labelled_folder"
root = "dataEngine/data/test_data/mozhi"
label_files = { test = "test_gt.txt" }
separator = "\t"
langs = ["hi"]
script = "printed"
level = "word"
out_dir = "outputs/data/test/crops/printed_words"
