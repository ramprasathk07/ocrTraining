# Test data (dataEngine/data/test_data) → records for evaluation only.
#   python -m dataEngine --config configs/data/test_data.toml golden
#   python -m dataEngine --config configs/data/test_data.toml split
#   python -m dataEngine --config configs/data/test_data.toml --workers 8 crops --source golden_regions

seed = 1234

[golden]
data_root = "dataEngine/data/test_data/src_golden"
out_dir = "outputs/data/test/golden"
exclude_langs = ["mr"]
drop_invalid = false
# "<document id>" = ["<region>", "<unit>"] for ids the pattern cannot split; git-ignored (real names)
overrides_file = "dataEngine/data/test_data/id_overrides.toml"

[split]   # everything in test_data is test data
out_dir = "outputs/data/test/splits"
test_fraction = 1.0
dev_fraction = 0.0
max_group_fraction = 1.0

[[sources]]   # 538 regions from 49 golden pages
name = "golden_regions"
converter = "golden_regions"
pages = "outputs/data/test/golden/pages.jsonl"
splits = "outputs/data/test/splits"
data_root = "dataEngine/data/test_data/src_golden"
out_dir = "outputs/data/test/crops/golden_regions"

# Mozhi and IIIT-HW dev (official val) and test words. A machine with the full downloads gets
# them from `crops --source mozhi_hi / iiit_hw_dev` in configs/data/training_data.toml (all splits).
# An eval-only machine with just the official val + test splits in test_data uses these two: same
# label files, so the same record ids, written to the same folders the eval config reads.
# Dev = checkpoint curves during training; test = M1/M2 reports only.
#   python -m dataEngine --config configs/data/test_data.toml --workers 8 crops --source mozhi_hi
#   python -m dataEngine --config configs/data/test_data.toml --workers 8 crops --source iiit_hw_dev

[[sources]]   # Mozhi-Hindi val / test splits (10,114 / 10,173 printed words), https://ilocr.iiit.ac.in/dataset/7/
name = "mozhi_hi"
converter = "labelled_folder"
root = "dataEngine/data/test_data/mozhi"
label_files = { dev = "val/val_gt.txt", test = "test_gt.txt" }
separator = "\t"
langs = ["hi"]
script = "printed"
level = "word"
out_dir = "outputs/data/crops/mozhi_hi"

[[sources]]   # IIIT-INDIC-HW-WORDS-Hindi val / test splits (12,708 / 12,869 handwritten words), https://ilocr.iiit.ac.in/dataset/18/
name = "iiit_hw_dev"
converter = "labelled_folder"
root = "dataEngine/data/test_data/iiit_hw"
label_files = { dev = "val/val_gt.txt", test = "test/test_gt.txt" }
separator = "\t"
langs = ["hi"]
script = "handwritten"
level = "word"
out_dir = "outputs/data/crops/iiit_hw_dev"
